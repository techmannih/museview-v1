name: Circuit checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r routing/requirements.txt
      - run: bun run regenerate:routing
        env:
          PYTHON: python
      - run: git diff --exit-code -- pcb-routes.json
      - run: bun run verify
      - run: bun run snapshot
      - run: bun run export:assembly && bun run render:sheets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-checks-and-output
          path: |
            dist/
            checks/
            release/
          retention-days: 14
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [ap, sta]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          path: firmware
          command: idf.py -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.ci-${{ matrix.mode }}" build
      - uses: actions/upload-artifact@v4
        with:
          name: museview-esp32s3-firmware-${{ matrix.mode }}-compile-test
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
            firmware/build/flash_args
          retention-days: 30
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd monitor --frozen-lockfile
      - run: bun monitor/validate.mjs
      - run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined firmware/test/capture_policy_test.c -o /tmp/museview-capture-test
          /tmp/museview-capture-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-validation
          path: |
            monitor/validation-results.json
            monitor/validation-tests.log
          retention-days: 30
